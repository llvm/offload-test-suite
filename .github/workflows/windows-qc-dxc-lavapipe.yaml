name: Windows ARM64 Lavapipe DXC

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # run every 6 hours
  pull_request:
    paths:
     - .github/workflows/windows-qc-dxc-lavapipe.yaml

jobs:
  Resolve-Frequent-Builds:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/resolve-frequent-builds.yaml

  Windows-ARM64-Lavapipe-DXC:
    permissions:
      contents: read
      checks: write
      actions: read
    needs: Resolve-Frequent-Builds
    uses: ./.github/workflows/test-callable.yaml
    with:
      OS: windows
      Arch: arm64
      SKU: windows-qc
      TestTarget: check-hlsl-vk-lavapipe
      OffloadTest-branch: ${{ github.ref }}
      LlvmRunId: ${{ needs.Resolve-Frequent-Builds.outputs.LlvmRunId }}
      DxcRunId: ${{ needs.Resolve-Frequent-Builds.outputs.DxcRunId }}
