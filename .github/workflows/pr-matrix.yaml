name: Execution Testing

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # TODO: migration template. Uncomment the resolver and one SKU at a time,
  # deleting that SKU's cells from the legacy blocks below, never both.
  # PRs never build LLVM/DXC; the resolver pins one frequent-build run for
  # every cell. See docs/offload-distribution.md ("Frequent Builder").
  #
