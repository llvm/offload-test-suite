name: Validate Frequent Builder

# Manual-only check of the consuming half: resolves a frequent-build.yaml
# run and runs one lit suite against its artifacts on a GPU runner. This is
# the exact path pr-matrix cells take once migrated.
# See docs/offload-distribution.md ("Frequent Builder").

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      # Single-option today; listed so the axes stay visible and Phase 2 is
      # an append. Only values build-callable.yaml accepts are offered.
      OS:
        description: 'Target OS (windows only -- the frequent-builder pool has no macOS machines)'
        required: true
        default: 'windows'
        type: choice
        options:
        - windows
      Arch:
        description: 'Target arch (x64 only -- arm64 cross-compile lands in Phase 2)'
        required: true
        default: 'x64'
        type: choice
        options:
        - x64
      SKU:
        description: 'x64 GPU runner SKU to run the tests on'
        required: true
        type: choice
        options:
        - windows-intel
        - windows-nvidia
        - windows-amd
        - windows-sw-rasterizer-x86_64
      TestTarget:
        description: 'lit suite to run'
        required: true
        type: choice
        options:
        - check-hlsl-d3d12
        - check-hlsl-clang-d3d12
        - check-hlsl-vk
        - check-hlsl-clang-vk
        - check-hlsl-warp-d3d12
        - check-hlsl-clang-warp-d3d12
        - check-hlsl-vk-lavapipe
        - check-hlsl-clang-vk-lavapipe
      BuildRunId:
        description: 'frequent-build.yaml run ID to consume. Leave blank to use the newest successful run on main.'
        required: false
        default: ''
        type: string
      OffloadTest-branch:
        description: 'Test Suite Branch'
        required: false
        default: 'main'
        type: string
      OffloadTest-fork:
        description: 'Test Suite Fork'
        required: false
        default: 'llvm'
        type: string
      LLVM-branch:
        description: 'LLVM Branch'
        required: false
        default: 'main'
        type: string
      LLVM-fork:
        description: 'LLVM Fork'
        required: false
        default: 'llvm'
        type: string
      BuildType:
        description: 'Build Type'
        required: false
        default: 'RelWithDebInfo'
        type: choice
        options:
        - Release
        - RelWithDebInfo
        - Debug

jobs:
  Resolve-Frequent-Build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      RunId: ${{ steps.resolve.outputs.run_id }}
    steps:
      - name: Resolve frequent build run
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PINNED: ${{ inputs.BuildRunId }}
        run: |
          set -euo pipefail
          run_id="$PINNED"
          if [ -z "$run_id" ]; then
            # Trust only schedule/dispatch runs from this repo: a fork PR
            # branch named `main` also matches `branch=main`.
            run_id=$(gh api \
              "/repos/$REPO/actions/workflows/frequent-build.yaml/runs?status=success&branch=main&per_page=50" \
              --jq '[.workflow_runs[]
                     | select((.event == "schedule" or .event == "workflow_dispatch")
                              and .head_repository.full_name == env.REPO)][0].id // empty')
          fi
          if [ -z "$run_id" ]; then
            echo "::error::No successful frequent-build.yaml run on main. Dispatch it once to seed the artifacts."
            exit 1
          fi
          echo "Using frequent build run $run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

  Exec-Test:
    permissions:
      contents: read
      checks: write
      actions: read
    needs: Resolve-Frequent-Build
    uses: ./.github/workflows/test-callable.yaml
    with:
      OS: ${{ inputs.OS }}
      Arch: ${{ inputs.Arch }}
      SKU: ${{ inputs.SKU }}
      TestTarget: ${{ inputs.TestTarget }}
      BuildType: ${{ inputs.BuildType }}
      OffloadTest-branch: ${{ inputs.OffloadTest-branch }}
      OffloadTest-fork: ${{ inputs.OffloadTest-fork }}
      LLVM-branch: ${{ inputs.LLVM-branch }}
      LLVM-fork: ${{ inputs.LLVM-fork }}
      BuildRunId: ${{ needs.Resolve-Frequent-Build.outputs.RunId }}
