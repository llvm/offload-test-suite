name: Validate Frequent Builder

# Manual-only check of the consuming half: resolves the LLVM and DXC
# frequent-build runs and runs one lit suite against their artifacts on a
# GPU runner. This is the exact path pr-matrix cells take once migrated.
# See docs/frequent-builder.md.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      # Single-option today; listed so the axes stay visible and Phase 2 is
      # an append. Only values the build workflows accept are offered.
      OS:
        description: 'Target OS (windows only -- the frequent-builder pool has no macOS machines)'
        required: true
        default: 'windows'
        type: choice
        options:
        - windows
      Arch:
        description: 'Target arch (x64 only -- arm64 cross-compile lands in Phase 2)'
        required: true
        default: 'x64'
        type: choice
        options:
        - x64
      SKU:
        description: 'x64 GPU runner SKU to run the tests on'
        required: true
        type: choice
        options:
        - windows-intel
        - windows-nvidia
        - windows-amd
        - windows-sw-rasterizer-x86_64
      TestTarget:
        description: 'lit suite to run'
        required: true
        type: choice
        options:
        - check-hlsl-d3d12
        - check-hlsl-clang-d3d12
        - check-hlsl-vk
        - check-hlsl-clang-vk
        - check-hlsl-warp-d3d12
        - check-hlsl-clang-warp-d3d12
        - check-hlsl-vk-lavapipe
        - check-hlsl-clang-vk-lavapipe
      LlvmRunId:
        description: 'frequent-build-llvm.yaml run ID to consume. Leave blank to use the newest successful run on main.'
        required: false
        default: ''
        type: string
      DxcRunId:
        description: 'frequent-build-dxc.yaml run ID to consume. Leave blank to use the newest successful run on main.'
        required: false
        default: ''
        type: string
      OffloadTest-branch:
        description: 'Test Suite Branch'
        required: false
        default: 'main'
        type: string
      OffloadTest-fork:
        description: 'Test Suite Fork'
        required: false
        default: 'llvm'
        type: string
      LLVM-branch:
        description: 'LLVM Branch'
        required: false
        default: 'main'
        type: string
      LLVM-fork:
        description: 'LLVM Fork'
        required: false
        default: 'llvm'
        type: string
      BuildType:
        description: 'Build Type'
        required: false
        default: 'RelWithDebInfo'
        type: choice
        options:
        - Release
        - RelWithDebInfo
        - Debug

jobs:
  Resolve-Frequent-Builds:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/resolve-frequent-builds.yaml
    with:
      LlvmRunId: ${{ inputs.LlvmRunId }}
      DxcRunId: ${{ inputs.DxcRunId }}

  Exec-Test:
    permissions:
      contents: read
      checks: write
      actions: read
    needs: Resolve-Frequent-Builds
    uses: ./.github/workflows/test-callable.yaml
    with:
      OS: ${{ inputs.OS }}
      Arch: ${{ inputs.Arch }}
      SKU: ${{ inputs.SKU }}
      TestTarget: ${{ inputs.TestTarget }}
      BuildType: ${{ inputs.BuildType }}
      OffloadTest-branch: ${{ inputs.OffloadTest-branch }}
      OffloadTest-fork: ${{ inputs.OffloadTest-fork }}
      LLVM-branch: ${{ inputs.LLVM-branch }}
      LLVM-fork: ${{ inputs.LLVM-fork }}
      LlvmRunId: ${{ needs.Resolve-Frequent-Builds.outputs.LlvmRunId }}
      DxcRunId: ${{ needs.Resolve-Frequent-Builds.outputs.DxcRunId }}
