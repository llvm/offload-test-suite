name: Validate Frequent Builder

# Manual-only end-to-end check of the frequent-builder pipeline: builds the
# distribution, then consumes it on a GPU runner for one SKU and lit suite.
# See docs/offload-distribution.md ("Frequent Builder").

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      # Single-option today; listed so the axes stay visible and Phase 2 is
      # an append. Only values build-callable.yaml accepts are offered.
      OS:
        description: 'Target OS (windows only -- the frequent-builder pool has no macOS machines)'
        required: true
        default: 'windows'
        type: choice
        options:
        - windows
      Arch:
        description: 'Target arch (x64 only -- arm64 cross-compile lands in Phase 2)'
        required: true
        default: 'x64'
        type: choice
        options:
        - x64
      SKU:
        description: 'x64 GPU runner SKU to run the tests on'
        required: true
        type: choice
        options:
        - windows-intel
        - windows-nvidia
        - windows-amd
        - windows-sw-rasterizer-x86_64
      TestTarget:
        description: 'lit suite to run'
        required: true
        type: choice
        options:
        - check-hlsl-d3d12
        - check-hlsl-clang-d3d12
        - check-hlsl-vk
        - check-hlsl-clang-vk
        - check-hlsl-warp-d3d12
        - check-hlsl-clang-warp-d3d12
        - check-hlsl-vk-lavapipe
        - check-hlsl-clang-vk-lavapipe
      OffloadTest-branch:
        description: 'Test Suite Branch'
        required: false
        default: 'main'
        type: string
      OffloadTest-fork:
        description: 'Test Suite Fork'
        required: false
        default: 'llvm'
        type: string
      LLVM-branch:
        description: 'LLVM Branch'
        required: false
        default: 'main'
        type: string
      LLVM-fork:
        description: 'LLVM Fork'
        required: false
        default: 'llvm'
        type: string
      DXC-branch:
        description: 'DXC Branch'
        required: false
        default: 'main'
        type: string
      BuildType:
        description: 'Build Type'
        required: false
        default: 'RelWithDebInfo'
        type: choice
        options:
        - Release
        - RelWithDebInfo
        - Debug
      LLVM-ExtraCMakeArgs:
        # Matches pr-matrix.yaml so a dispatch reuses its cached build.
        description: 'Extra CMake Args for LLVM'
        required: false
        default: '-DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl'
        type: string

jobs:
  Build-Windows-X64:
    uses: ./.github/workflows/build-callable.yaml
    with:
      OS: ${{ inputs.OS }}
      Arch: ${{ inputs.Arch }}
      OffloadTest-branch: ${{ inputs.OffloadTest-branch }}
      OffloadTest-fork: ${{ inputs.OffloadTest-fork }}
      LLVM-branch: ${{ inputs.LLVM-branch }}
      LLVM-fork: ${{ inputs.LLVM-fork }}
      DXC-branch: ${{ inputs.DXC-branch }}
      BuildType: ${{ inputs.BuildType }}
      LLVM-ExtraCMakeArgs: ${{ inputs.LLVM-ExtraCMakeArgs }}

  Exec-Test:
    permissions:
      contents: read
      checks: write
    needs: Build-Windows-X64
    uses: ./.github/workflows/test-callable.yaml
    with:
      OS: ${{ inputs.OS }}
      Arch: ${{ inputs.Arch }}
      SKU: ${{ inputs.SKU }}
      TestTarget: ${{ inputs.TestTarget }}
      BuildType: ${{ inputs.BuildType }}
      OffloadTest-branch: ${{ inputs.OffloadTest-branch }}
      OffloadTest-fork: ${{ inputs.OffloadTest-fork }}
      LLVM-branch: ${{ inputs.LLVM-branch }}
      LLVM-fork: ${{ inputs.LLVM-fork }}
      ArtifactName: ${{ needs.Build-Windows-X64.outputs.ArtifactName }}
      DXCArtifactName: ${{ needs.Build-Windows-X64.outputs.DXCArtifactName }}
