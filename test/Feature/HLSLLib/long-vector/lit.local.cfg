# SPV_EXT_long_vector is not in the -fspv-extension=DXC set that lit.cfg.py
# passes, so without it Clang splits each long vector into 4-element vectors.
if "Clang" in config.available_features and "Vulkan" in config.available_features:
    config.substitutions.append(
        ("%long_vector_flags", "-fspv-extension=SPV_EXT_long_vector")
    )
else:
    config.substitutions.append(("%long_vector_flags", ""))
